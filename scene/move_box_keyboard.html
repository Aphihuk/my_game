<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playing Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" width="1500" height="1100" tabindex="0"></canvas>
    <div class="timer">
      <p id="timeDisplay">Time: 0s</p>
      <p id="scoreDisplay">Score: 0</p>
    </div>
    <a href="../frontend/index.html" class="back-btn">ກັບຫນ້າເມມ</a>
    <div class="back-btn1">
      <h5>ເດີນໜ້າ w a s d</h5>
      <h5>ກດ E ເພື່ອເລັ່ງຄວາມໄວ</h5>
      <h5>ກດ q ຢູດເວລາ</h5>
    </div>

    <div id="startScreen">
      <div class="modal-content">
        <h1>ເລີ່ມເກມ</h1>
        <p>ກົດປຸ່ມເລີ່ມເພື່ອເລີ່ມຫຼິ້ນເກມ</p>
        <p>ເດີນໜ້າ w a s d</p>
        <p>ກດ E ເພື່ອເລັ່ງຄວາມໄວ</p>
        <p>ກດ q ຢູດເວລາ</p>

        <div class="button-group">
          <button id="btnStart">ເລີ່ມເກມ</button>
        </div>
      </div>
    </div>

    <div id="gameOverScreen" class="hidden">
      <div class="modal-content">
        <h1>ເເພ້ ເກມ</h1>
        <p>ຫົວໃຈໜົດເເລ້ວ ບັກຫຳ</p>
        <div class="button-group">
          <button id="btnRetry">ຫລີນອີກທີ</button>
          <button id="btnMenu">ກັບຫນ້າ ເມນູ</button>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
